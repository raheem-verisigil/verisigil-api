name: Fix document request schema and numeric extraction

on:
  push:
    branches:
      - fix/document-workflow-id-numeric-regex-20261124

permissions:
  contents: write

concurrency:
  group: document-workflow-id-numeric-regex
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEPLOY_ENV: test
      SUPABASE_URL: http://127.0.0.1:1
      SUPABASE_KEY: test-anon-key-not-a-credential
      SUPABASE_SERVICE_KEY: test-service-key-not-a-credential
      VERISIGIL_API_KEY: test-api-key-not-a-credential
      SIGN_SECRET: test-signing-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/document-workflow-id-numeric-regex-20261124
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Repair request schema and numeric extraction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          source = path.read_text(encoding="utf-8")

          model_old = '    interaction_num: int  = 1\n    document_type:   str = "general"'
          model_new = '    interaction_num: int  = 1\n    workflow_id:      str = ""\n    document_type:   str = "general"'
          if source.count(model_old) != 1:
              raise SystemExit(f"DocumentVerifyRequest schema precondition failed: {source.count(model_old)}")
          source = source.replace(model_old, model_new, 1)

          regex_old = StringRaw = r"r'\b\\d+(?:\\.\\d+)?%?\b'"
          regex_new = r"r'\b\d+(?:\.\d+)?%?\b'"
          count = source.count(regex_old)
          if count != 2:
              raise SystemExit(f"Numeric regex precondition failed: expected 2 double-escaped patterns, found {count}")
          source = source.replace(regex_old, regex_new)

          if "workflow_id:      str = \"\"" not in source:
              raise SystemExit("workflow_id field was not added")
          if source.count(regex_new) < 2:
              raise SystemExit("Numeric regex correction was not applied")

          path.write_text(source, encoding="utf-8")
          print("Added workflow_id to DocumentVerifyRequest and corrected numeric extraction regexes.")
          PY
      - name: Compile application and tests
        run: python -m compileall -q .
      - name: Run focused security and regression tests
        run: |
          python -m unittest tests.test_document_governance_decision -v
          python -m unittest tests.test_proof_verification -v
          python -m unittest tests.test_execution_authorization_fail_closed -v
          python -m unittest tests.test_agent_identity_layer -v
          python -m unittest tests.test_durable_validation_receipts -v
          python -m unittest tests.test_terry_validation -v
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v
      - name: Commit tested document corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Fix document workflow schema and numeric extraction"
          git push origin HEAD:fix/document-workflow-id-numeric-regex-20261124
