name: VeriSigil Security Repair Validation

on:
  push:
    branches:
      - security/proof-verification-hardening-20261113

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: security/proof-verification-hardening-20261113
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependency
        run: python -m pip install --upgrade cryptography

      - name: Apply source hardening
        run: |
          python security_hardening.py
          python security_hardening_followup.py

      - name: Compile affected Python modules
        run: |
          python -m py_compile main.py proof_verification.py test_public_endpoints.py
          python -m py_compile resource_governance.py verisigil_ai_sdk.py verisigil_sdk.py verisigil_connectors.py

      - name: Run proof verification regression suite
        run: python -m unittest tests.test_proof_verification -v

      - name: Commit verified source repair to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply verified proof verification hardening [skip ci]"
            git push origin HEAD:security/proof-verification-hardening-20261113
          else
            echo "No source changes to commit."
          fi
