name: VeriSigil bounded adversarial validation

on:
  push:
    branches:
      - security/proof-verification-hardening-20261113
  pull_request:
    branches:
      - main

jobs:
  proof-and-adversarial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_ENV: test
      SUPABASE_URL: http://127.0.0.1:1
      SUPABASE_KEY: verisigil-test-only-not-a-credential
      VERISIGIL_API_KEY: verisigil-test-api-key-only
      SIGN_SECRET: verisigil-test-signing-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Run cryptographic regression tests
        run: python -m unittest tests.test_proof_verification -v
      - name: Run Terry bounded adversarial validation
        run: python -m unittest tests.test_terry_validation -v
