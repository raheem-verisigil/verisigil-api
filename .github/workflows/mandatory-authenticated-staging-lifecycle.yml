name: Mandatory authenticated Passport staging lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passport-staging-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticated-staging-lifecycle:
    name: Authenticated tenant, isolation and API-key lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERISIGIL_STAGING_BASE_URL: https://verisigil-passport-staging-api-staging.up.railway.app
      VERISIGIL_STAGING_SUPABASE_URL: ${{ secrets.VERISIGIL_STAGING_SUPABASE_URL }}
      VERISIGIL_STAGING_SUPABASE_ANON_KEY: ${{ secrets.VERISIGIL_STAGING_SUPABASE_ANON_KEY }}
      VERISIGIL_STAGING_TEST_OWNER_EMAIL: ${{ secrets.VERISIGIL_STAGING_TEST_OWNER_EMAIL }}
      VERISIGIL_STAGING_TEST_OWNER_PASSWORD: ${{ secrets.VERISIGIL_STAGING_TEST_OWNER_PASSWORD }}
      VERISIGIL_STAGING_TEST_OTHER_EMAIL: ${{ secrets.VERISIGIL_STAGING_TEST_OTHER_EMAIL }}
      VERISIGIL_STAGING_TEST_OTHER_PASSWORD: ${{ secrets.VERISIGIL_STAGING_TEST_OTHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cryptographic acceptance dependencies
        run: python -m pip install --disable-pip-version-check "PyNaCl>=1.5.0" "rfc8785>=0.1.0"
      - name: Require isolated staging configuration
        env:
          REQUIRED_STAGING_URL: https://verisigil-passport-staging-api-staging.up.railway.app
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          required = (
              "VERISIGIL_STAGING_SUPABASE_URL",
              "VERISIGIL_STAGING_SUPABASE_ANON_KEY",
              "VERISIGIL_STAGING_TEST_OWNER_EMAIL",
              "VERISIGIL_STAGING_TEST_OWNER_PASSWORD",
              "VERISIGIL_STAGING_TEST_OTHER_EMAIL",
              "VERISIGIL_STAGING_TEST_OTHER_PASSWORD",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing required staging secrets: " + ", ".join(missing))
          configured = urlparse(os.environ.get("VERISIGIL_STAGING_BASE_URL", ""))
          expected = urlparse(os.environ["REQUIRED_STAGING_URL"])
          if configured.scheme != "https" or configured.hostname != expected.hostname:
              raise SystemExit("Refusing to run authenticated acceptance against an unapproved staging host.")
          print("Isolated staging configuration validated; secret values were not printed.")
          PY
      - name: Run mandatory authenticated live staging acceptance
        run: python tests/staging_authenticated_lifecycle.py
