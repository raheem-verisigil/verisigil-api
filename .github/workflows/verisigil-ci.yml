name: VeriSigil CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Syntax check application entrypoints
        run: |
          python -m py_compile main.py verisigil_entrypoint.py agent_identity_layer.py durable_validation_receipts.py
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("main.py", "verisigil_entrypoint.py", "agent_identity_layer.py", "durable_validation_receipts.py"):
              source = Path(name).read_text(encoding="utf-8")
              ast.parse(source)
              print(f"PASS AST {name}: {source.count(chr(10)):,} lines")
          PY

  invariants:
    name: Python Security & Regression Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install pinned application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run actual Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  api-tests:
    name: Mandatory Isolated Staging Runtime Tests
    runs-on: ubuntu-latest
    needs: invariants
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERISIGIL_STAGING_BASE_URL: https://verisigil-passport-staging-api-staging.up.railway.app
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Run read-only staging health, OpenAPI and fail-closed auth checks
        run: python tests/staging_runtime_gates.py

  deploy-summary:
    name: Required Release Gate Summary
    runs-on: ubuntu-latest
    needs: [lint, invariants, api-tests]
    if: always()
    steps:
      - name: Enforce every applicable release gate
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          REGRESSION_RESULT: ${{ needs.invariants.result }}
          STAGING_RESULT: ${{ needs.api-tests.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "================================"
          echo "VERISIGIL CI/CD RELEASE GATES"
          echo "================================"
          echo "Lint:              $LINT_RESULT"
          echo "Python regression: $REGRESSION_RESULT"
          echo "Staging runtime:   $STAGING_RESULT"
          echo "Event:             $EVENT_NAME"
          echo "Commit:            ${{ github.sha }}"
          echo "================================"

          if [ "$LINT_RESULT" != "success" ]; then
            echo "FAILED — lint gate did not succeed"
            exit 1
          fi
          if [ "$REGRESSION_RESULT" != "success" ]; then
            echo "FAILED — Python regression gate did not succeed"
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$STAGING_RESULT" != "success" ]; then
            echo "FAILED — mandatory isolated staging runtime gate did not succeed"
            exit 1
          fi
          echo "All applicable release gates PASSED."
