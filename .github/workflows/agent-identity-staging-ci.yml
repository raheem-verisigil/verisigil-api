name: Cryptographic Passport identity regression

on:
  pull_request:
    branches: [security/proof-verification-hardening-20261113]
    paths:
      - "agent_identity_layer.py"
      - "verisigil_entrypoint.py"
      - "supabase/migrations/**"
      - "tests/test_agent_identity_layer.py"
      - ".github/workflows/agent-identity-staging-ci.yml"
      - "tests/staging_authenticated_lifecycle.py"
  push:
    branches: [feature/cryptographic-passport-runtime-identity-20261123, hardening/verisigil-production-readiness-20261123]

permissions:
  contents: read

jobs:
  identity-regression:
    name: Passport, tenant and authority regression tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://identity-test.invalid
      SUPABASE_KEY: test-anon-key-not-a-secret
      SUPABASE_SERVICE_KEY: test-service-key-not-a-secret
      VERISIGIL_API_KEY: test-api-key-not-a-secret
      SIGN_SECRET: test-signing-secret-not-for-deployment
      DEPLOY_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile the identity integration
        run: python -m py_compile agent_identity_layer.py verisigil_entrypoint.py
      - name: Run identity and authority security tests
        run: |
          python -m unittest discover -s tests -p "test_agent_identity_layer.py" -v
          python -m unittest discover -s tests -p "test_proof_verification.py" -v

  authenticated-staging-lifecycle:
    name: Live authenticated Passport and tenant-isolation acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERISIGIL_STAGING_BASE_URL: https://verisigil-passport-staging-api-staging.up.railway.app
      VERISIGIL_STAGING_SUPABASE_URL: ${{ secrets.VERISIGIL_STAGING_SUPABASE_URL }}
      VERISIGIL_STAGING_SUPABASE_ANON_KEY: ${{ secrets.VERISIGIL_STAGING_SUPABASE_ANON_KEY }}
      VERISIGIL_STAGING_TEST_OWNER_EMAIL: ${{ secrets.VERISIGIL_STAGING_TEST_OWNER_EMAIL }}
      VERISIGIL_STAGING_TEST_OWNER_PASSWORD: ${{ secrets.VERISIGIL_STAGING_TEST_OWNER_PASSWORD }}
      VERISIGIL_STAGING_TEST_OTHER_EMAIL: ${{ secrets.VERISIGIL_STAGING_TEST_OTHER_EMAIL }}
      VERISIGIL_STAGING_TEST_OTHER_PASSWORD: ${{ secrets.VERISIGIL_STAGING_TEST_OTHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install live acceptance dependencies
        run: python -m pip install --disable-pip-version-check "PyNaCl>=1.5.0" "rfc8785>=0.1.0"
      - name: Run live authenticated staging lifecycle
        run: python tests/staging_authenticated_lifecycle.py
