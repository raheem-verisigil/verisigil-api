name: VeriSigil security and staging verification

on:
  push:
    branches:
      - main
      - security/proof-verification-hardening-20261113
      - hardening/verisigil-production-readiness-20261123
      - integration/legacy-registry-bridge-20261123
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verisigil-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_ENV: test
      SUPABASE_URL: http://127.0.0.1:1
      SUPABASE_KEY: verisigil-test-only-not-a-credential
      SUPABASE_SERVICE_KEY: verisigil-test-service-only
      VERISIGIL_API_KEY: verisigil-test-api-key-only
      SIGN_SECRET: verisigil-test-signing-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile source
        run: python -m compileall -q .
      - name: Run cryptographic regression tests
        run: python -m unittest tests.test_proof_verification -v
      - name: Run fail-closed execution authorization tests
        run: python -m unittest tests.test_execution_authorization_fail_closed -v
      - name: Run bounded adversarial scenarios
        run: python -m unittest tests.test_terry_validation -v
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v
      - name: Run pytest suite
        run: PYTHONPATH=. pytest -q tests

  staging-api-tests:
    if: ${{ github.event_name == 'push' }}
    needs: focused-security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERISIGIL_TEST_ENV: staging
      VERISIGIL_TEST_URL: https://verisigil-passport-staging-api-staging.up.railway.app
      VERISIGIL_TEST_API_KEY: ${{ secrets.VERISIGIL_TEST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install live-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate staging configuration
        if: ${{ env.VERISIGIL_TEST_URL != '' && env.VERISIGIL_TEST_API_KEY != '' }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["VERISIGIL_TEST_URL"]
          parsed = urlparse(url)
          if parsed.scheme != "https":
              raise SystemExit("Staging URL must use HTTPS")
          if parsed.hostname != "verisigil-passport-staging-api-staging.up.railway.app":
              raise SystemExit("Staging URL does not match the approved Passport staging host")
          print("Staging configuration validated; secret values were not printed.")
          PY
      - name: Run live staging API verification
        if: ${{ env.VERISIGIL_TEST_URL != '' && env.VERISIGIL_TEST_API_KEY != '' }}
        run: python -m pytest tests/staging_verisigil_api.py -v
      - name: Report skipped live verification when staging secrets are absent
        if: ${{ env.VERISIGIL_TEST_URL == '' || env.VERISIGIL_TEST_API_KEY == '' }}
        run: echo "Live staging verification skipped; required GitHub secrets are not configured."
